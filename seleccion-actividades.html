<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades - BiblioKids</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .selection-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            margin-top: 10px;
        }
        .btn-actividad {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 25px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .btn-actividad:active { transform: scale(0.96); }
        
        /* Colores temáticos */
        .algebra { background: #4285F4; }      /* Azul */
        .geometria { background: #EA4335; }    /* Rojo */
        .estadistica { background: #FBBC04; }  /* Amarillo */
        
        .icon-circle {
            background: rgba(255,255,255,0.2);
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .back-link {
            text-align: center;
            display: block;
            margin-top: 30px;
            color: #5f6368;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="welcome-header">
            <img src="narciso.png" alt="Logo" style="width: 70px; margin-bottom: 10px;">
            <h1>Actividades</h1>
            <p>Selecciona una materia para ver los talleres</p>
        </header>

        <div class="selection-container">
            <a href="https://drive.google.com/drive/folders/1mTkZUt9j6BFfvUd-76Zq8zrfiNkIDHz6?usp=sharing" target="_blank" class="btn-actividad algebra">
                <div class="icon-circle">📐</div>
                <span>Talleres: Álgebra</span>
            </a>

            <a href="https://drive.google.com/drive/folders/1JryBe7luhN0z2Go4sZum-ggTENBkfZW7?usp=sharing"_blank" class="btn-actividad geometria">
                <div class="icon-circle">📏</div>
                <span>Talleres: Geometría</span>
            </a>

            <a href="https://drive.google.com/drive/folders/1eR0lyEEGJCSIBs12fV_YmrSdXBcskqgm?usp=sharing"_blank" class="btn-actividad estadistica">
                <div class="icon-circle">📊</div>
                <span>Talleres: Estadística</span>
            </a>
        </div>

        <a href="index.html" class="back-link">⬅️ Volver al Menú Principal</a>
    </div>
</body>
</html>
